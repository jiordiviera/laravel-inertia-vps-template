name: ${COMPOSE_PROJECT_NAME:-laravel-inertia-app}

x-app: &app
  image: ${APP_IMAGE:?Set APP_IMAGE}:${IMAGE_TAG:?Set IMAGE_TAG}
  env_file:
    - .env.production
  restart: unless-stopped
  volumes:
    - storage:/app/storage
  networks:
    - internal
  depends_on:
    redis:
      condition: service_healthy

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis:/data
    networks:
      - internal
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
  app:
    <<: *app
    ports:
      - '127.0.0.1:${APP_PORT:-18080}:8080'
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:8080/up']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
  queue:
    <<: *app
    command: ['php', 'artisan', 'queue:work', '--tries=3', '--max-time=3600', '--sleep=3', '--no-interaction']
    stop_grace_period: 60s
  scheduler:
    <<: *app
    command: ['php', 'artisan', 'schedule:work']

networks:
  internal:
volumes:
  storage:
  redis:
