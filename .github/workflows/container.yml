name: container
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Detect Laravel application
        id: app
        run: |
          if test -f composer.json && test -f composer.lock && test -f package.json && test -f pnpm-lock.yaml && test -f artisan; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "Infrastructure-only template: container build skipped."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v3
        if: steps.app.outputs.ready == 'true'
      - name: Log in to GHCR
        if: github.event_name == 'push' && steps.app.outputs.ready == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        if: steps.app.outputs.ready == 'true'
        with:
          context: .
          target: runtime
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
