name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app_testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U app -d app_testing"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: app_testing
      DB_USERNAME: app
      DB_PASSWORD: app
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Detect Laravel application
        id: app
        run: |
          if test -f composer.json && test -f composer.lock && test -f package.json && test -f pnpm-lock.yaml && test -f artisan; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "Infrastructure-only template: application checks skipped."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: shivammathur/setup-php@v2
        if: steps.app.outputs.ready == 'true'
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, mbstring, intl, bcmath, gd, zip
          tools: composer:v2
          coverage: none
      - uses: pnpm/action-setup@v4
        if: steps.app.outputs.ready == 'true'
        with:
          version: 12.4.2
      - uses: actions/setup-node@v4
        if: steps.app.outputs.ready == 'true'
        with:
          node-version: '22'
          cache: pnpm
      - run: composer install --no-interaction --prefer-dist
        if: steps.app.outputs.ready == 'true'
      - run: pnpm install --frozen-lockfile
        if: steps.app.outputs.ready == 'true'
      - run: cp .env.example .env && php artisan key:generate
        if: steps.app.outputs.ready == 'true'
      - run: pnpm run build
        if: steps.app.outputs.ready == 'true'
      - run: php artisan test
        if: steps.app.outputs.ready == 'true'
